<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Kopilia</title>
    <!--
      Page d'attente de l'application : la boule de Kopilia et sa galaxie (le même
      dessin que l'écran, orb.js, construit par build.sh depuis apps/web), placées
      comme sur la page de Kopilia, qui prend leur place dès que le serveur répond.
    -->
    <style>
      :root { color-scheme: dark light; --bg: #0f1115; --text: #e8eaed; --muted: #9aa0ab; --accent: #5b8cff; --accent-2: #38d39f; }
      @media (prefers-color-scheme: light) { :root { --bg: #f5f6f8; --text: #15171c; --muted: #5c636e; } }
      html, body { margin: 0; height: 100%; }
      body { background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .neural { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
      .app { position: relative; z-index: 1; min-height: 100dvh; max-width: 760px; margin: 0 auto; padding: 0 16px; display: flex; flex-direction: column; }
      /* Hauteurs de l'en-tête (avec ses boutons) et de la barre du bas de l'écran, mesurées : la boule reste au même endroit. */
      header { display: flex; align-items: center; gap: 10px; padding: 18px 0 10px; box-sizing: border-box; min-height: 57.5px; }
      .brand { font-weight: 600; letter-spacing: 0.3px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
      .center { flex: 1; min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; }
      .orb { position: relative; width: 168px; height: 168px; border-radius: 50%; }
      .sphere { position: absolute; inset: -100px; width: 368px; height: 368px; pointer-events: none; display: block; }
      .hint { margin: 0; color: var(--muted); font-size: 14px; min-height: 1.5em; text-align: center; max-width: 420px; }
      .bottom { flex: 0 0 auto; height: 94px; }
    </style>
  </head>
  <body>
    <canvas class="neural" aria-hidden="true"></canvas>
    <div class="app">
      <header>
        <span class="dot"></span>
        <span class="brand">Kopilia</span>
      </header>
      <main class="center">
        <div class="orb"><canvas class="sphere" aria-hidden="true"></canvas></div>
        <p class="hint" aria-live="polite">Kopilia se réveille…</p>
      </main>
      <footer class="bottom"></footer>
    </div>
    <script src="orb.js"></script>
  </body>
</html>
